<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DataLens — إنشاء حساب</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
<section class="auth-page">
  <div class="auth-card">
<div class="auth-visual">
  <div class="brand">
    <span class="logo">DL</span>
    <div>
      <b>DataLens</b><small>Analytics Platform </small>
    </div>
  </div>
  <p>من البيانات الخام إلى رؤى واضحة.</p>
  <ul>
    <li>تحليل البيانات بسهولة</li>
    <li>دعم CSV و JSON</li>
    <li>تقارير ورسوم تحليلية</li>
  </ul>
</div>
<div class="auth-form-panel">
  <h2>إنشاء حساب</h2>
  <form>
    <label>الاسم الكامل<input type="text" required></label>
    <label>اسم المستخدم<input type="text" required></label>
    <label>البريد الإلكتروني<input type="email" required></label>
    <label>كلمة المرور<input type="password" required></label>
    <button class="primary" type="button">إنشاء الحساب</button>
  </form>
  <p class="auth-switch">لديك حساب؟ <a href="login.html">تسجيل الدخول</a></p>
</div>
</div>
</section>
  </body>
</html>
